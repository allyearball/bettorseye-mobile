# =============================================================================
# THE BETTORSEYE PHONE APPS, BUILT IN THE CLOUD.
# =============================================================================
# Jon is on a PC, and an iPhone app can only be built on a Mac, so GitHub's Mac
# runners build it and upload it straight to App Store Connect. The Android app
# is built on Linux and comes out as an .aab to upload to Google Play.
#
# Nothing secret is in this repo. Every key lives in the repo's secrets
# (Settings > Secrets and variables > Actions):
#
#   Android (the upload key; make it once with the "make_upload_key" run below)
#     ANDROID_KEYSTORE_BASE64   ANDROID_KEYSTORE_PASSWORD   ANDROID_KEY_ALIAS
#   iPhone (App Store Connect > Users and Access > Integrations > API key, "App Manager")
#     APPSTORE_KEY_ID   APPSTORE_ISSUER_ID   APPSTORE_KEY_P8_BASE64   APPLE_TEAM_ID
#
# Start it from the Actions tab: "mobile" > Run workflow, and tick what to build.
name: mobile

on:
  workflow_dispatch:
    inputs:
      android:
        description: 'Build the Android app (.aab)'
        type: boolean
        default: true
      ios:
        description: 'Build the iPhone app and upload it to App Store Connect'
        type: boolean
        default: true
      make_upload_key:
        description: 'ONE TIME: make the Android upload key (download it, save it as secrets, delete the download)'
        type: boolean
        default: false
      version:
        description: 'Version shown in the stores'
        type: string
        default: '1.0'

jobs:
  upload-key:
    if: ${{ inputs.make_upload_key }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Make the key
        run: |
          PASS=$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 24)
          keytool -genkeypair -v -keystore upload.keystore -alias upload -keyalg RSA -keysize 2048 \
            -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=BettorsEye, O=BettorsEye, C=US"
          mkdir out
          base64 -w0 upload.keystore > out/ANDROID_KEYSTORE_BASE64.txt
          printf '%s' "$PASS" > out/ANDROID_KEYSTORE_PASSWORD.txt
          printf 'upload' > out/ANDROID_KEY_ALIAS.txt
          cp upload.keystore out/upload.keystore
          echo "KEEP upload.keystore and the password somewhere safe (a password manager). Google needs this same key for every update." > out/README.txt
      - uses: actions/upload-artifact@v4
        with: { name: android-upload-key, path: out, retention-days: 1 }

  android:
    if: ${{ inputs.android && !inputs.make_upload_key }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: gradle }
      - run: npm ci
      - run: npx cap sync android
      - name: Build the signed .aab
        env:
          BE_VERSION_CODE: ${{ github.run_number }}
          BE_VERSION_NAME: ${{ inputs.version }}
          BE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BE_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS64" ]; then echo "::error::No ANDROID_KEYSTORE_BASE64 secret. Run this once with make_upload_key ticked first."; exit 1; fi
          echo "$KS64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          export BE_KEYSTORE_PATH="$RUNNER_TEMP/upload.keystore"
          cd android && chmod +x gradlew && ./gradlew bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: bettorseye-android-${{ inputs.version }}-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab

  ios:
    if: ${{ inputs.ios && !inputs.make_upload_key }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npx cap sync ios
      - name: Archive and upload to App Store Connect
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
          P8: ${{ secrets.APPSTORE_KEY_P8_BASE64 }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in KEY_ID ISSUER P8 TEAM; do if [ -z "${!v}" ]; then echo "::error::Missing App Store secret ($v)."; exit 1; fi; done
          KEY="$RUNNER_TEMP/AuthKey.p8"; echo "$P8" | base64 -d > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER")
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="${{ inputs.version }}" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            "${AUTH[@]}" archive
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist ios/ExportOptions.plist -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}"
          echo "Uploaded. It shows in App Store Connect > TestFlight after Apple processes it (5-30 minutes)."
